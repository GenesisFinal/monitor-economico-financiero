name: Actualizar Monitor Financiero

on:
  schedule:
    # Runs at 21:00 ART (00:00 UTC) Monday through Friday
    - cron: '0 0 * * 2-6'
  workflow_dispatch:
    inputs:
      force_full_update:
        description: 'Forzar actualización completa (--force)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dashboard Builder
        env:
          PYTHONPATH: '.'
          TZ: 'America/Argentina/Buenos_Aires'
        run: |
          if [ "${{ github.event.inputs.force_full_update }}" = "true" ]; then
            python src/builder/dashboard_builder.py --force
          else
            python src/builder/dashboard_builder.py
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update financial dashboard [skip ci]" && git push)
